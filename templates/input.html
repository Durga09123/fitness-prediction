<!DOCTYPE html>

<html>
<head>
    <title>Fitness & BMI Analysis</title>


<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">


</head>

<body>

<div class="container">


<h1>Fitness & BMI Analysis</h1>

{% if error %}
<p class="error-message">{{ error }}</p>
{% endif %}

<form action="/predict" method="POST">

    <label>Age</label>

    <input type="number"
           name="age"
           value="{{ form_data.get('age', '') }}"
           required>


    <label>Gender</label>

    <select name="gender">

        <option value="" disabled
            {% if not form_data.get('gender') %}selected{% endif %}>
            Select Gender
        </option>

        <option value="1"
            {% if form_data.get('gender') == '1' %}selected{% endif %}>
            Male
        </option>

        <option value="0"
            {% if form_data.get('gender') == '0' %}selected{% endif %}>
            Female
        </option>

    </select>


    <label>Height (cm)</label>

    <input type="number"
           step="0.1"
           name="height"
           value="{{ form_data.get('height', '') }}"
           required>


    <label>Weight (kg)</label>

    <input type="number"
           step="0.1"
           name="weight"
           value="{{ form_data.get('weight', '') }}"
           required>


    <label>Exercise Minutes / Day</label>

    <input type="number"
           name="exercise_minutes"
           value="{{ form_data.get('exercise_minutes', '') }}"
           required>


    <label>Daily Calories</label>

    <input type="number"
           name="calories"
           value="{{ form_data.get('calories', '') }}"
           required>


    <label>Sleep Hours</label>

    <input type="number"
           step="0.1"
           name="sleep_hours"
           value="{{ form_data.get('sleep_hours', '') }}"
           required>


    <button type="submit">
        Analyze Fitness & BMI
    </button>


    <a href="/">
        <button type="button">
            Cancel
        </button>
    </a>

</form>


</div>

</body>
</html>
