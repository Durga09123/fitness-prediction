<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Weight Prediction</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

<style>

    .weight-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
    }

    .weight-card {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
    }

    .weight-card h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
        box-sizing: border-box;
    }

    .predict-btn {
        width: 100%;
        padding: 13px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    .predict-btn:hover {
        background: #1d4ed8;
    }

    .back-btn {
        display: block;
        text-align: center;
        margin-top: 15px;
        padding: 12px;
        background: #6b7280;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
    }

    .back-btn:hover {
        background: #4b5563;
    }

    .error-message {
        background: #fee2e2;
        color: #dc2626;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        font-weight: bold;
    }

    .period-info {
        font-size: 13px;
        color: #666;
        margin-top: 5px;
    }

</style>


</head>

<body>

<div class="weight-container">


<div class="weight-card">

    <h1>⚖️ Weight Prediction</h1>

    <p class="subtitle">
        Predict your estimated weight for 1 to 12 months
    </p>


    {% if error %}

    <div class="error-message">
        {{ error }}
    </div>

    {% endif %}


    <form action="{{ url_for('predict_weight_page') }}"
          method="POST">


        <div class="form-group">

            <label>Current Weight (kg)</label>

            <input type="number"
                   name="weight"
                   step="0.1"
                   min="20"
                   max="300"
                   placeholder="Enter your current weight"
                   required>

        </div>


        <div class="form-group">

            <label>Height (cm)</label>

            <input type="number"
                   name="height"
                   step="0.1"
                   min="100"
                   max="250"
                   placeholder="Enter your height"
                   required>

        </div>


        <div class="form-group">

            <label>Age</label>

            <input type="number"
                   name="age"
                   min="10"
                   max="100"
                   placeholder="Enter your age"
                   required>

        </div>


        <div class="form-group">

            <label>Gender</label>

            <select name="gender" required>

                <option value="">Select Gender</option>
                <option value="0">Female</option>
                <option value="1">Male</option>

            </select>

        </div>


        <div class="form-group">

            <label>Exercise Minutes per Day</label>

            <input type="number"
                   name="exercise_minutes"
                   min="0"
                   max="600"
                   placeholder="Example: 60"
                   required>

        </div>


        <div class="form-group">

            <label>Daily Calories</label>

            <input type="number"
                   name="calories"
                   min="500"
                   max="10000"
                   placeholder="Example: 2000"
                   required>

        </div>


        <div class="form-group">

            <label>Sleep Hours</label>

            <input type="number"
                   name="sleep_hours"
                   step="0.1"
                   min="1"
                   max="24"
                   placeholder="Example: 7"
                   required>

        </div>


        <div class="form-group">

            <label>Activity Level</label>

            <select name="activity_level" required>

                <option value="">Select Activity Level</option>
                <option value="Low">Low</option>
                <option value="Moderate">Moderate</option>
                <option value="High">High</option>

            </select>

        </div>


        <div class="form-group">

            <label>Prediction Period</label>

            <select name="months" required>

                <option value="">Select Prediction Period</option>

                <option value="1">1 Month</option>
                <option value="2">2 Months</option>
                <option value="3">3 Months</option>
                <option value="4">4 Months</option>
                <option value="5">5 Months</option>
                <option value="6">6 Months</option>
                <option value="7">7 Months</option>
                <option value="8">8 Months</option>
                <option value="9">9 Months</option>
                <option value="10">10 Months</option>
                <option value="11">11 Months</option>
                <option value="12">12 Months</option>

            </select>

            <div class="period-info">
                Choose how many months you want to predict.
            </div>

        </div>


        <button type="submit"
                class="predict-btn">
            Predict Weight
        </button>


    </form>


    <a href="{{ url_for('home') }}"
       class="back-btn">
        🏠 Back to Dashboard
    </a>

</div>


</div>

</body>

</html>
